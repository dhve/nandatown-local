name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke run (Lab)
        run: nandatown run marketplace --out /tmp/runs
      - name: Smoke run (Track)
        run: nandatown run quote-crash-restart --out /tmp/runs

  neutralize-legacy-deploy-status:
    if: github.repository == 'projnanda/nandatown' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Supersede retired Railway deploy status
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"success","context":"Nanda Town - nest-dashboard","description":"Auto-deploy retired; dashboard serves from archive/legacy via manual deploys"}'
