name: auction
description: Sealed-bid auction with signed bids, a late bid rejected after close, exactly one payment by the winner, and losers never charged.
seed: 42
agents:
  - name: auctioneer
    role: auctioneer
    config: {item: print-001, close_after: 3.0, balance_cents: 0}
  - name: bidder-x
    role: bidder
    config: {valuation_cents: 700, bid_delay: 1.0, balance_cents: 2000}
  - name: bidder-y
    role: bidder
    config: {valuation_cents: 900, bid_delay: 1.2, balance_cents: 2000}
  - name: bidder-late
    role: bidder
    config: {valuation_cents: 950, bid_delay: 6.0, balance_cents: 2000}
max_time: 60
